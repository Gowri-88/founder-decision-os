<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founder Decision OS</title>
<meta name="description" content="Turn a chaotic product wishlist into two focused current bets.">
<link rel="stylesheet" href="css/styles.css">
</head>

<div class="app-shell">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <span class="mobile-header__title">Founder Decision OS</span>
  </header>

  <nav id="sidebar" class="sidebar" aria-label="Primary">
    <div class="sidebar__brand">
      <span class="sidebar__brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="10" width="4" height="11" rx="1" fill="currentColor"/>
          <rect x="10" y="5" width="4" height="16" rx="1" fill="currentColor"/>
          <rect x="17" y="13" width="4" height="8" rx="1" fill="currentColor"/>

      </span>
      <span class="sidebar__brand-name">Founder Decision OS</span>
    </div>

    <ul class="sidebar__nav">
      <li><a class="nav-link" href="#dashboard" data-nav-route="dashboard">Dashboard</a></li>
      <li><a class="nav-link" href="#evidence-gate" data-nav-route="evidence-gate">Evidence Gate</a></li>
      <li><a class="nav-link" href="#bets" data-nav-route="bets">Bets</a></li>
      <li><a class="nav-link" href="#council" data-nav-route="council">Bet Council</a></li>
      <li><a class="nav-link" href="#logs" data-nav-route="logs">Decision Logs</a></li>
      <li><a class="nav-link" href="#how-it-works" data-nav-route="how-it-works">How it works</a></li>
    </ul>

    <div class="sidebar__footer">
      <button type="button" class="btn btn--ghost btn--full" data-action="reset-workspace">Reset workspace</button>
    </div>
  </nav>

  <div class="sidebar-backdrop" data-action="menu-toggle" aria-hidden="true"></div>

  <main id="main-content" class="main-content">
    <div id="app-root" class="app-root" role="main" aria-live="polite"></div>
  </main>

</div>

<div id="modal-root" class="modal-root" aria-hidden="false"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/storage.js"></script>
<script src="js/calculations.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/generators.js"></script>
<script src="js/evidence-gate.js"></script>

<script src="js/app.js"></script>
